name: Tests

on:
  push:
    branches: [main, develop, desenv]
  pull_request:
    branches: [main, develop, desenv]

jobs:
  flutter-tests:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter test
        run: flutter test --coverage

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    needs: flutter-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare CI Gradle settings
        run: |
          chmod +x android/gradlew
          sed -i '/^org.gradle.java.home=/d; /^org.gradle.jvmargs=/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G' >> android/gradle.properties

      - name: Run Android tests via Fastlane
        run: bundle exec fastlane android tests

  ios-tests:
    name: iOS Unit Tests
    runs-on: macos-latest
    # Desativado: projeto iOS incompleto (sem ios/Podfile). Reativar quando o iOS estiver configurado num Mac.
    if: false
    continue-on-error: true
    needs: flutter-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run iOS tests via Fastlane
        run: bundle exec fastlane ios tests
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID:       ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: fastlane/AuthKey.p8
          MATCH_GIT_URL:   ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
